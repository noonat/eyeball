{{define "headmeta"}}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} &middot; Eyeball</title>
<link rel="stylesheet" href="/static/app.css?b={{.Token}}">
<link rel="stylesheet" href="/static/shell.css?b={{.Token}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<meta name="theme-color" content="#f3f4f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eyeball">
{{with .VAPID}}<meta name="vapid-key" content="{{.}}">
{{end}}<meta name="eyeball-build" content="{{.Build}}">
{{end}}
{{define "shell"}}<!doctype html>
<html lang="en" data-theme="light">
<head>
{{template "headmeta" .}}{{with .Failure}}<meta name="eyeball-error" content="{{.}}">
{{end}}<script src="/static/app.js?b={{.Token}}"></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
{{end}}
